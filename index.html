		this.tierPool = ['L0'];
		if (this.level >= 30) {this.tierPool.push('L30')};
		if (this.level >= 60) {this.tierPool.push('L60')};
		this.ingredients['L0'] = pokemonName.ingredients['L0'];
		this.ingredients['L30'] = {[level30ing] : pokemonName.ingredients['L30'][level30ing]};
		this.ingredients['L60'] = {[level60ing] : pokemonName.ingredients['L60'][level60ing]};
		this.berry = pokemonName.berry;
		this.energy = 100;
		this.color = pokemonName.color || 'grey';
		this.grossResources = 0;
		this.nextHelpTime = 10;
		this.frequency = pokemonName.frequency;
		this.skillStalled = false;
		this.resourcesFromSkills = 0;
		this.resourcesFromBerries = 0;
		this.resourcesFromIngredients = 0;
		//The tick parameter should only be provided by the -1 energy every 10 minutes feature. 
		this.adjustEnergy = function(energyChange, tick){
			let natureEnergyMod = this.nature['EnergyRecovery'] || 1;
			if (tick) { 
				natureEnergyMod = 1;
			};
						
			this.energy += energyChange * natureEnergyMod;
			if(this.energy < 0){
			  this.energy = 0;
			}
			return this.energy;
		}
		this.help = function(){
			let helpPower = 1;
			let coinFlip = Math.floor(Math.random() *2);
			//flip a coin to see if it is ingredients or berries
			//TODO: weight for ingredient finder sub skill
			if (coinFlip === 0) {
				helpPower = this.berry+this.level;
				//TODO: berry finder sub skill
				if (this.specialty == "Berries"){
					helpPower += this.berry+this.level;
				}
				this.resourcesFromBerries += helpPower;
			} else {
			   let tierPick = this.tierPool[Math.floor(Math.random() * this.tierPool.length)];
			   let nameOfIng = Object.keys(this.ingredients[tierPick])[0];
			   let countOfIng = this.ingredients[tierPick][nameOfIng];
			   helpPower = ingredients[nameOfIng]*countOfIng;
			   this.resourcesFromIngredients += helpPower;
			   //REMINDER: Remove this once you make a real bag/pot. 
				ingredientBag += countOfIng;
			}
			this.grossResources += helpPower;
			
			let skillCheck = Math.random() *100;
			let natureSkillMod = this.nature['MainSkillChance'] || 1;
			//TODO: subSkill skill weights
			let subSkillSkillMod = false || 1;

			if (skillCheck < 20*natureSkillMod*subSkillSkillMod || this.skillStalled == true){

							this.grossResources += mainSkills[this.mainSkill][this.mainSkillLevel-1];

							break;

							this.grossResources += mainSkills[this.mainSkill][this.mainSkillLevel-1];
							this.resourcesFromSkills += mainSkills[this.mainSkill][this.mainSkillLevel-1];
							//TODO

							this.grossResources += mainSkills[this.mainSkill][this.mainSkillLevel-1];
							this.resourcesFromSkills += mainSkills[this.mainSkill][this.mainSkillLevel-1];
							//TODO

							//TODO

						case'DreamShardMagnetSVar':

							//TODO

							//TODO

					}	
				};

				team[i].energy = 100;
				
			  }
			  //reduce energy by 1 every 10 minutes
			  if(seconds > 0 && seconds % 600 == 0) {team[i].adjustEnergy(-1,true);};
			  
			  //Log enegy and resources values once per team member
			  if(seconds % (updateRate) == 0 ){ 
			    energy[teamPlace].push(parseInt(team[i].energy));
				resources[teamPlace].push(parseInt(team[i].grossResources));
				
			  }			  
			}
			//Only log time axis increment once per whole time
			if(seconds % (updateRate) == 0 ){ 
				time.push(intToTime(seconds));
				//console.log(seconds+" "+intToTime(seconds));
			};
			if(seconds == bedTime) {
				sleeping = true;
				bedTime = bedTime + (60*60*24);				
			}
			if(seconds == wakeTime) {
				sleeping = false;
				wakeTime = wakeTime + (60*60*24);
			}
			seconds = seconds+1;
		};
		
      }
	  

	 buildData();
	 
	 function pushDataToCharts() {
		 for(i in team){
			 var teamPlace = team.indexOf(team[i]);
			 myChart.data.datasets.push({
				 label: team[i].name+team[i].teamSlot+' Energy',
				 data: energy[teamPlace],
				 fill: false,
				 borderColor: team[i].color,
				 backgroundColor: team[i].color,
				 borderWidth: 1,
				 pointRadius: 0,

			});
			myChart2.data.datasets.push({
				 label: team[i].name+team[i].teamSlot+' Power',
				 data: resources[teamPlace],
				 fill: false,
				 borderColor: team[i].color,
				 backgroundColor: team[i].color,
				 borderWidth: 1,
				 pointRadius: 0,

			})
		
		}
	myChart.data.labels = time;
	myChart2.data.labels = time;
	myChart.update();
	myChart2.update();	
	};
	
	function resetCharts() {
		myChart.data.labels = [];
		myChart2.data.labels = [];
		myChart.data.datasets = [];
		myChart2.data.datasets = [];
		myChart.update();
		myChart2.update();
	};

	var totalResources = 0;
		
	for(i in team){
		console.log(team[i].name+team[i].teamSlot+':\t'+team[i].resourcesFromBerries+'b\t'+team[i].resourcesFromIngredients+'i\t'+team[i].resourcesFromSkills+'s\t'+team[i].grossResources);
		totalResources += team[i].grossResources;
	}
	
	console.log(totalResources);
	
	console.log(Math.round(totalResources/runDays) + " power per day. "+ Math.round(totalResources/runDays)*7+" power per week.");
	
	console.log("need to spend "+Math.round((ingredientBag/runDays)/3)+" ingredients per meal. Does not account for Sundays.");
	
	pushDataToCharts();
	
    </script>
