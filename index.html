	  var bedTime = 60*60*16;

	  function makePokemon(pokemonName,level,nature,level30ing,level60ing,mainSkillLevel,sub1,sub2,sub3,sub4,sub5){
		//Figure out a way to Maximize
		this.name = pokemonName.name;
		this.level = level;
		this.specialty = pokemonName.specialty;
		this.mainSkill = pokemonName.mainSkill;
		this.mainSkillLevel = mainSkillLevel
		this.evolvesTo = pokemon[pokemonName.evolvesTo]
		this.finalEvolution = pokemon[pokemonName.finalEvolution];
		this.ingredients = {};
		this.tierPool = ['L0'];
		if (this.level >= 30) {this.tierPool.push('L30')};
		if (this.level >= 60) {this.tierPool.push('L60')};
		this.ingredients['L0'] = pokemonName.ingredients['L0'];
		this.ingredients['L30'] = {[level30ing] : pokemonName.ingredients['L30'][level30ing]};
		this.ingredients['L60'] = {[level60ing] : pokemonName.ingredients['L60'][level60ing]};
		this.berry = pokemonName.berry;
		this.energy = 100;
		this.color = pokemonName.color || 'grey';
		this.grossResources = 0;
		this.nextHelpTime = 10;
		this.frequency = pokemonName.frequency;
		this.skillStalled = false;
		this.adjustEnergy = function(energyChange){
			this.energy += energyChange;
			if(this.energy < 0){
			  this.energy = 0;
			}
			return this.energy;
		}
		this.help = function(){
			let helpPower = 1;
			let coinFlip = Math.floor(Math.random() *2);
			//flip a coin to see if it is ingredients or berries
			//TODO: weight for ingredient finder sub skill
			if (coinFlip === 0) {
				helpPower = this.berry+this.level;
				//TODO: berry finder sub skill
				if (this.specialty == "Berries"){
					helpPower += this.berry+this.level;
				}
			} else {
			   let tierPick = this.tierPool[Math.floor(Math.random() * this.tierPool.length)];
			   let nameOfIng = Object.keys(this.ingredients[tierPick])[0];
			   let countOfIng = this.ingredients[tierPick][nameOfIng];
			   helpPower = ingredients[nameOfIng]*countOfIng;
			}
			this.grossResources += helpPower;
			let skillCheck = Math.random() *100;
			//10% chance to hit skill
			//Overnight, skills will stall once they trigger once and will not reset til you wake up.
			if (skillCheck < 5 || this.skillStalled == true){
				//Since the skills don't actually trigger til morning, this saves your success until then
				//This is especially important so that your energy overcaps in the morning for energy skills
				if (sleeping) {
					this.stillStalled = true;
					
				} else {
					this.skillStalled = false;
					//TODO Charge Energy S
					//TODO Charge Strength S
					//TODO Charge Strength M*
					//TODO Charge Strength S - Var
					//TODO Cooking Power-Up S*
					//TODO Dream Shard Magnet S*
					//TODO Dream Shard Magnet S - Var*
					//TODO Energizing Cheer S*
					//TODO Energy for Everyone S*
					if (this.mainSkill == 'Energy for Everyone S'){
						let skillLevels= [5,7,9,11,15,18]
						for(i in team){
							team[i].adjustEnergy(skillLevels[mainSkillLevel-1]);
						}
					}
				//TODO Extra Helpful S*
				//TODO Ingredient Magnet S
				//TODO Metronome
				};
				
				
			}
			return this.grossResources;
		}
		
		team.push(this);
	  }

	   //updateRate determines granularity of the graph. Bigger number = fewer x-axis ticks.

		const updateRate = 2400;

      function buildData() {

		
		//TODO: Replace this with in-browser dropdowns
		

		//Run for a full week
		

		var seconds = 0;
		
		while(seconds < runTil){
		

			//Loop through whole team
			for(i in team){
			  var teamPlace = team.indexOf(team[i]);
			  
			  if (seconds == team[i].nextHelpTime){
				  let energyFactor = Math.min(team[i].energy, 1.5);
			      let nextHelpDelay = Math.round(team[i].frequency / (1+(1.5*energyFactor/100)));
				  
				  team[i].nextHelpTime = team[i].nextHelpTime + nextHelpDelay;
				  //console.log(team[i].name + teamPlace+" will help in " + nextHelpDelay + ' sec, at '+team[i].nextHelpTime);
				  team[i].help();
			  }

			  //restore energy to 100 at start of every day
			  if (seconds % (24*60*60) == 0){
			  
				team[i].energy = 100;
				
			  }
			  //reduce energy by 1 every 10 minutes
			  if(seconds > 0 && seconds % 600 == 0) {team[i].adjustEnergy(-1);};
			  
			  //Log enegy and resources values once per team member
			  if(seconds % (updateRate) == 0 ){ 
			    energy[teamPlace].push(parseInt(team[i].energy));
				resources[teamPlace].push(parseInt(team[i].grossResources));
				
			  }			  
			}
			//Only log time axis increment once per whole time
			if(seconds % (updateRate) == 0 ){ time.push(parseInt(seconds));};
			if(seconds == bedTime) {
				sleeping = true;
				bedTime = bedTime + (60*60*24);				
			}
			if(seconds == wakeTime) {
				sleeping = false;
				wakeTime = wakeTime + (60*60*24);
			}
			seconds = seconds+1;
		};
		
      }
	  

	 buildData();
